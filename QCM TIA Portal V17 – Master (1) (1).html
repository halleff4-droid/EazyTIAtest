<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark;
--bg:#f5f7fa;--card:#fff;--tx:#1b2430;--mut:#5b6777;--ac:#1f3a5f;--acb:#fff;--bd:#d9e0e8;--ok:#1b7f3b;--okb:#e3f4e8;--ko:#b3261e;--kob:#fbe7e5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--mut:#9aa7b6;--ac:#7fb0ff;--acb:#0b1220;--bd:#2c3644;--ok:#6fd08c;--okb:#16301f;--ko:#ff8a80;--kob:#3a1a18}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--mut:#9aa7b6;--ac:#7fb0ff;--acb:#0b1220;--bd:#2c3644;--ok:#6fd08c;--okb:#16301f;--ko:#ff8a80;--kob:#3a1a18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;color:var(--ac);margin:8px 0}h2{font-size:1.05rem;color:var(--ac);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:.9rem}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:var(--ac);color:var(--acb);font-weight:600}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.t{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);margin:8px 0;font-weight:500}
input[type=password]{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);text-align:center;letter-spacing:.4em;margin:12px 0;box-sizing:border-box}
.q{font-weight:600;margin-bottom:8px}
label.o{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;cursor:pointer}
label.o.ok{background:var(--okb);border-color:var(--ok)}label.o.ko{background:var(--kob);border-color:var(--ko)}
.ex{margin-top:8px;font-size:.92rem;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.err{color:var(--ko);min-height:1.4em}
.score{font-size:2rem;font-weight:700;color:var(--ac)}
footer.by{text-align:center;color:var(--mut);opacity:.7;font-size:.8rem;padding:24px 16px 16px}
[hidden]{display:none!important}
</style></head><body><main>

function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function unlock(){
 if($("#pw").value==="0000"){
  D=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(B64),c=>c.charCodeAt(0))));
  $("#lock").hidden=true;$("#app").hidden=false;home();
 }else{$("#lerr").textContent="Mot de passe incorrect.";$("#pw").select()}
}
$("#go").onclick=unlock;$("#pw").onkeydown=e=>{if(e.key==="Enter")unlock()};
function home(){
 const a=$("#app");a.replaceChildren();window.scrollTo(0,0);
 a.append(el("h1",0,"QCM d’automatisation – TIA Portal V17"),
  el("p","mut","Niveau Master. Choisissez un test : 16 questions, une seule bonne réponse par question, correction détaillée à la fin."));
 D.forEach((s,si)=>{a.append(el("h2",0,s.serie));
  s.tests.forEach((t,ti)=>{const b=el("button","t");const k=si+"-"+ti;
   b.append(el("div",0,t.id+" – "+t.theme),el("div","mut",t.qs.length+" questions"+(best[k]!=null?" · meilleur score : "+best[k]+" / "+t.qs.length:"")));
   b.onclick=()=>run(si,ti);a.append(b)})});
}
function run(si,ti){
 const t=D[si].tests[ti],a=$("#app");a.replaceChildren();window.scrollTo(0,0);
 a.append(el("h1",0,t.id),el("p","mut",t.theme));
 const prog=el("p","mut","Répondu : 0 / "+t.qs.length);a.append(prog);
 t.qs.forEach((q,i)=>{const c=el("div","card");c.append(el("div","q",(i+1)+". "+q.q));
  q.o.forEach((o,j)=>{const l=el("label","o");const r=document.createElement("input");r.type="radio";r.name="q"+i;r.value=j;
   r.onchange=()=>{prog.textContent="Répondu : "+a.querySelectorAll("input:checked").length+" / "+t.qs.length};
   l.append(r,el("span",0,"ABCD"[j]+") "+o));c.append(l)});a.append(c)});
 const err=el("div","err");const row=el("div","row");const v=el("button",0,"Valider mes réponses");const b=el("button","sec","Retour");
 let warned=false;b.onclick=home;
 v.onclick=()=>{const n=t.qs.length-a.querySelectorAll("input:checked").length;
  if(n>0&&!warned){warned=true;err.textContent=n+" question(s) sans réponse. Appuyez de nouveau pour valider quand même.";return}
  grade(si,ti)};
 row.append(v,b);a.append(err,row);
}
function grade(si,ti){
 const t=D[si].tests[ti],a=$("#app");let sc=0;
 const cards=a.querySelectorAll(".card");
 t.qs.forEach((q,i)=>{const ch=a.querySelector('input[name="q'+i+'"]:checked');const g=ch?+ch.value:-1;if(g===q.a)sc++;
  const c=cards[i];c.querySelectorAll("label.o").forEach((l,j)=>{l.querySelector("input").disabled=true;
   if(j===q.a)l.classList.add("ok");else if(j===g)l.classList.add("ko")});
  c.append(el("div","ex",(g===q.a?"Correct. ":g<0?"Sans réponse. Bonne réponse : "+"ABCD"[q.a]+". ":"Incorrect. Bonne réponse : "+"ABCD"[q.a]+". ")+q.e))});
 const k=si+"-"+ti;if(best[k]==null||sc>best[k])best[k]=sc;
 const n=t.qs.length,m=sc>=n*.8?"Excellent":sc>=n*.625?"Bien":sc>=n*.5?"Moyen":"À revoir";
 const r=el("div","card");r.append(el("div","score",sc+" / "+n),el("div",0,m+" – "+Math.round(sc/n*100)+" %"));

 again.onclick=()=>run(si,ti);back.onclick=home;row.append(again,back);r.append(row);
 a.querySelector(".err").remove();a.querySelector(".row:last-of-type").remove();
 a.querySelector("h1").after(r);window.scrollTo(0,0);
}
